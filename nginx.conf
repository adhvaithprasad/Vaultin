events {}

http {
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 80;

        # Proxy requests to git-server
        location /git/ {
            proxy_pass http://git-server:8000/;
        }

        # Proxy WebSocket connections to Express (code-editor)
        location /code/ {
    proxy_pass http://code-editor:3000/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect off;
}

location /code/ws {
    proxy_pass http://code-editor:3000/ws;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # WebSocket Headers
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";
}


location /login {
    alias /login-page;
    index auth.html;
}
location /signup {
    alias /signup-page;
    index auth.html;
}

        # Serve the frontend app if static files exist
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri /index.html;
        }
    }
}

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
        import { updateProfile,getAuth, createUserWithEmailAndPassword, signInWithPopup, signInWithEmailAndPassword, GoogleAuthProvider, GithubAuthProvider, FacebookAuthProvider } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-auth.js";
    
        const firebaseConfig ={
    apiKey: "AIzaSyAF-IdZDqP_R2TwdOmUqB9iNjYJpSJMGpE",
    authDomain: "vaultin-code.firebaseapp.com",
    projectId: "vaultin-code",
    storageBucket: "vaultin-code.firebasestorage.app",
    messagingSenderId: "994300410425",
    appId: "1:994300410425:web:8ad4600314558f3c84abe8",
    measurementId: "G-20JN452H3S",
    databaseURL: "https://vaultin-code-default-rtdb.asia-southeast1.firebasedatabase.app"
  };
    
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
    
        window.googleLogin = function() {
            const provider = new GoogleAuthProvider();
            signInWithPopup(auth, provider)
                .then(() => afterlogin())
                .catch(err => console.error(err.message));
        }
    
        window.githubLogin = function() {
            const provider = new GithubAuthProvider();
            signInWithPopup(auth, provider)
                .then(() => afterlogin())
                .catch(err => console.error(err.message));
        }
    
       
    
        window.createAccount = function() {
        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;
        const displayName = document.getElementById("displayName").value;
        const photoURL = "https://api.dicebear.com/9.x/avataaars-neutral/svg?seed="+displayName;

        createUserWithEmailAndPassword(auth, email, password)
            .then(userCredential => {
                return updateProfile(userCredential.user, {
                    displayName: displayName,
                    photoURL: photoURL
                }).then(() => afterlogin());
            })
            .catch(err => console.error("Signup failed:", err.message));
    }
    
        function getQueryParam(name) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(name);
        }
    
        function afterlogin() {
            const encodedRedirect = getQueryParam("redirect");
    
            if (encodedRedirect) {
                try {
                    const decodedUrl = atob(encodedRedirect);
                    if (decodedUrl.startsWith("http") || decodedUrl.startsWith("/")) {
                        window.location.href = decodedUrl;
                    } else {
                        console.error("Invalid redirect URL:", decodedUrl);
                    }
                } catch (e) {
                    console.error("Error decoding Base64:", e);
                }
            }
        }
    </script>

/* Container to align the switch and text */
.switch-container {
  display: flex;
  align-items: center;
  gap: 8px;
  font-family: Arial, sans-serif;
  font-size: 14px;
  cursor: pointer;
  margin-top: 10px;
}

/* Hide the default checkbox */
.switch input {
  opacity: 0;
  width: 0;
  height: 0;
}

/* The toggle switch */
.switch {
  position: relative;
  display: inline-block;
  width: 34px;
  height: 18px;
}

/* The track (background) */
.slider {
  position: absolute;
  cursor: pointer;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background-color: #ccc;
  transition: 0.3s;
  border-radius: 34px;
}

/* The handle (circle) */
.slider::before {
  content: "";
  position: absolute;
  height: 14px;
  width: 14px;
  left: 2px;
  bottom: 2px;
  background-color: white;
  transition: 0.3s;
  border-radius: 50%;
}

/* When checked, move the handle and change the background color */
input:checked + .slider {
  background-color: #2196f3;
}

input:checked + .slider::before {
  transform: translateX(16px);
}

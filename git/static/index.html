<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vaultin Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://d3js.org/d3.v6.min.js"></script>
    <!-- <link rel="stylesheet" type="text/css" href="dist/calendar-heatmap.min.css"> -->
    <script src=https://www.gstatic.com/firebasejs/8.8.1/firebase-app.js></script>
  <script src=https://www.gstatic.com/firebasejs/8.8.1/firebase-auth.js></script>
</head>
<body>
    <div class="import-window-bg" style="display: none;">
        <div class="import-window">
            <div class="import-window-header">
                <h3 style="margin: 0px;">Import Git Repository</h3>
                <button class="close-import-window" onclick="toggleImportWindow()"><svg data-testid="geist-icon" height="16" stroke-linejoin="round" viewBox="0 0 16 16" width="16" style="color: currentcolor;"><path fill-rule="evenodd" clip-rule="evenodd" d="M9.96966 11.0303L10.5 11.5607L11.5607 10.5L11.0303 9.96966L9.06065 7.99999L11.0303 6.03032L11.5607 5.49999L10.5 4.43933L9.96966 4.96966L7.99999 6.93933L6.03032 4.96966L5.49999 4.43933L4.43933 5.49999L4.96966 6.03032L6.93933 7.99999L4.96966 9.96966L4.43933 10.5L5.49999 11.5607L6.03032 11.0303L7.99999 9.06065L9.96966 11.0303Z" fill="currentColor"></path></svg></button>
            </div>
            <form class="import-source">
<input type="radio" name="Git-url" id="git-url" value="url" checked/><label for="git-url">Git URL</label>
<input type="radio" name="Git-url" id="github" value="github"/><label for="github">GitHub</label>
            </form>
            <div class="import-window-content" id="import-window-content">
                <input type="text" id="repourl" placeholder="Enter the URL of the repository">
                <button onclick="importRepourl()"><svg data-testid="geist-icon" height="16" stroke-linejoin="round" viewBox="0 0 16 16" width="16" style="color: currentcolor;"><path fill-rule="evenodd" clip-rule="evenodd" d="M4.875 1.5C3.01104 1.5 1.5 3.01104 1.5 4.875V6.40385C1.5 7.22166 1.87727 7.95083 2.47018 8.42791L3.0545 8.89808L2.11415 10.0667L1.52982 9.59656C0.598275 8.84699 0 7.69502 0 6.40385V4.875C0 2.18261 2.18261 0 4.875 0C6.79184 0 8.44888 1.1064 9.2449 2.71201C9.35322 2.93049 9.51183 3 9.60112 3H12.25C14.3211 3 16 4.67893 16 6.75C16 7.8785 15.5006 8.89123 14.7133 9.57758L14.1479 10.0704L13.1622 8.93972L13.7276 8.44689C14.202 8.03329 14.5 7.42688 14.5 6.75C14.5 5.50736 13.4926 4.5 12.25 4.5H9.60112C8.79547 4.5 8.1902 3.96162 7.901 3.37829C7.34838 2.26364 6.20018 1.5 4.875 1.5ZM8.75 13.4393L10.7197 11.4697L11.25 10.9393L12.3107 12L11.7803 12.5303L8.70711 15.6036C8.31658 15.9941 7.68342 15.9941 7.29289 15.6036L4.21967 12.5303L3.68934 12L4.75 10.9393L5.28033 11.4697L7.25 13.4393V7.75V7H8.75V7.75V13.4393Z" fill="currentColor"></path></svg></button>
            </div>
            <div class="github-search" id="github-search" >
                <div class="search-bar">
                    <input type="text" id="github-search-bar" placeholder="Search for repositories">
                    <button id="search-btn">
                        <svg data-testid="geist-icon" height="16" stroke-linejoin="round" viewBox="0 0 16 16" width="16" style="color: currentcolor;"><path fill-rule="evenodd" clip-rule="evenodd" d="M1.5 6.5C1.5 3.73858 3.73858 1.5 6.5 1.5C9.26142 1.5 11.5 3.73858 11.5 6.5C11.5 9.26142 9.26142 11.5 6.5 11.5C3.73858 11.5 1.5 9.26142 1.5 6.5ZM6.5 0C2.91015 0 0 2.91015 0 6.5C0 10.0899 2.91015 13 6.5 13C8.02469 13 9.42677 12.475 10.5353 11.596L13.9697 15.0303L14.5 15.5607L15.5607 14.5L15.0303 13.9697L11.596 10.5353C12.475 9.42677 13 8.02469 13 6.5C13 2.91015 10.0899 0 6.5 0Z" fill="currentColor"></path></svg>
                      </button></div>

                <ul id="search-content">
                </ul>
            </div>
        </div>
    </div>
    <div class="sidebar">
        <div class="sidebar-nav"><h3>Vaultin</h3><button id="settings-icon" onclick="settingVisible()"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a2 2 0 0 0 .4 2.2l.2.2a2 2 0 0 1 0 2.8 2 2 0 0 1-2.8 0l-.2-.2a2 2 0 0 0-2.2-.4 2 2 0 0 0-1.2 1.8V21a2 2 0 0 1-4 0v-.4a2 2 0 0 0-1.2-1.8 2 2 0 0 0-2.2.4l-.2.2a2 2 0 0 1-2.8 0 2 2 0 0 1 0-2.8l.2-.2a2 2 0 0 0 .4-2.2 2 2 0 0 0-1.8-1.2H3a2 2 0 0 1 0-4h.4a2 2 0 0 0 1.8-1.2 2 2 0 0 0-.4-2.2l-.2-.2a2 2 0 0 1 0-2.8 2 2 0 0 1 2.8 0l.2.2a2 2 0 0 0 2.2.4 2 2 0 0 0 1.2-1.8V3a2 2 0 0 1 4 0v.4a2 2 0 0 0 1.2 1.8 2 2 0 0 0 2.2-.4l.2-.2a2 2 0 0 1 2.8 0 2 2 0 0 1 0 2.8l-.2.2a2 2 0 0 0-.4 2.2 2 2 0 0 0 1.8 1.2H21a2 2 0 0 1 0 4h-.4a2 2 0 0 0-1.8 1.2z"></path>
          </svg></button></div>
        <ul id="root" >
            <ul id="public-repo-list"></ul>
          
            
            
           
        </ul>
    </div>
    <div class="main-content" id="projects-bg">
        
        <div class="stats">
            <h3>My Workspace</h3>
            <div class="import">
                <div class="import-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 3v12"/>
                        <path d="M16 11l-4 4-4-4"/>
                        <path d="M4 19h16"/>
                      </svg>
                      
                </div>
                <div class="import-text">
                    <h5>Import Git Repository</h5>
                    <p>Easily import your existing git repositories from other platforms using a URL</p>
                </div>
                <div class="import-button">
                    <button onclick="toggleImportWindow()" >+ Import</button>
                </div>
            </div>
            
            
        </div>
        <div class="graph">
            <h3>Commit Activity</h3>
            <div id="calendar"></div>
        </div>
    </div>
    <div class="main-content" style="display: none;" id="setting-background">
        <div class="user-account"><img id="user-image-editor"/><div class="user-detail"><h5 id="user-name"></h5><p id="email"></p><p id="email-verified"></p></div><button id="logout" onclick="logout()">Logout</button></div>
        <div class="user-options">
            <button onclick="verifyemail()"><svg data-testid="geist-icon" height="16" stroke-linejoin="round" viewBox="0 0 16 16" width="16" style="color: currentcolor;"><path fill-rule="evenodd" clip-rule="evenodd" d="M13.2642 3.5H2.73578L8 8.01219L13.2642 3.5ZM1.5 4.41638V11.5C1.5 12.0523 1.94772 12.5 2.5 12.5H13.5C14.0523 12.5 14.5 12.0523 14.5 11.5V4.41638L8.48809 9.56944L8 9.98781L7.51191 9.56944L1.5 4.41638ZM0 2H1.5H14.5H16V3.5V11.5C16 12.8807 14.8807 14 13.5 14H2.5C1.11929 14 0 12.8807 0 11.5V3.5V2Z" fill="currentColor"></path></svg>Verify email</button>
            <button><svg data-testid="geist-icon" height="16" stroke-linejoin="round" viewBox="0 0 16 16" width="16" style="color: currentcolor;"><path fill-rule="evenodd" clip-rule="evenodd" d="M6.5 5.5C6.5 3.29086 8.29086 1.5 10.5 1.5C12.7091 1.5 14.5 3.29086 14.5 5.5C14.5 7.70914 12.7091 9.5 10.5 9.5C10.0496 9.5 9.61798 9.42583 9.21589 9.28964L9.09885 9.25H8.97528H8H7.25V10V12.25H5.75H5V13V14.5H1.5V11.5818L6.38022 7.14521L6.70674 6.84837L6.60585 6.41878C6.53673 6.12449 6.5 5.81702 6.5 5.5ZM10.5 0C7.46243 0 5 2.46243 5 5.5C5 5.77753 5.02062 6.05064 5.06048 6.31778L0.245495 10.695L0 10.9182V11.25V15.25V16H0.75H5.75H6.5V15.25V13.75H8H8.75V13V10.75H8.85639C9.37626 10.9126 9.92859 11 10.5 11C13.5376 11 16 8.53757 16 5.5C16 2.46243 13.5376 0 10.5 0ZM10.5 6.5C11.0523 6.5 11.5 6.05228 11.5 5.5C11.5 4.94772 11.0523 4.5 10.5 4.5C9.94771 4.5 9.5 4.94772 9.5 5.5C9.5 6.05228 9.94771 6.5 10.5 6.5Z" fill="currentColor"></path></svg>Change password</button></div>
    </div>
    <script src="script.js"></script>
    <script src="auth.js"></script>
</body>

</html>

services:
  git-server:
    build:
      context: ./git
      dockerfile: Dockerfile
    container_name: git-server-container1
    networks:
      - shared-network

  code-editor:
    build:
      context: ./editor
      dockerfile: Dockerfile
    container_name: code-editor-container1
    networks:
      - shared-network

  nginx:
    image: nginx:latest
    container_name: nginx-proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./auth-page:/auth-page:ro  # Mounts your auth page
    depends_on:
      - git-server
      - code-editor
    networks:
      - shared-network

networks:
  shared-network:
    driver: bridge
